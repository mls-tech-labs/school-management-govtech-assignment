name: pvt-edu-admin

services:
  mysql:
    image: mysql:8.0
    container_name: pvt-edu-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_inst}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # /docker-entrypoint-initdb.d is auto-executed by the official MySQL image on first boot
      # (when /var/lib/mysql is empty). Files are run in alphabetical order.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-uroot"
        - "-p${MYSQL_ROOT_PASSWORD:-rootpass}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pvt-edu-app
    restart: unless-stopped
    # Per `specs/003-backend-api-db/spec.md` FR-016 (Session 2026-06-21),
    # there is NO `migration` one-shot service and NO `migration:run` step
    # on boot. The MySQL schema, audit columns, `ulid` columns, FK
    # constraints, UNIQUE indexes, and the `subjects` / `levels`
    # reference-list seed data are all created by the user against the
    # user-prepared MySQL container (mirrored in
    # `docker/mysql/init/01-schema-and-seed.sql`). The app is read/write
    # at runtime only — it connects to the existing MySQL.
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: rootpass
      DB_NAME: edu_inst
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

volumes:
  mysql_data:
    name: pvt-edu-mysql-data
