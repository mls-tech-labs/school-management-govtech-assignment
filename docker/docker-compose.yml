name: pvt-edu-admin

services:
  mysql:
    image: mysql:8.0
    container_name: pvt-edu-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_inst}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-uroot"
        - "-p${MYSQL_ROOT_PASSWORD:-rootpass}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pvt-edu-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: rootpass
      DB_NAME: edu_inst
      REDIS_URL: redis://redis:6379
      SESSION_COOKIE_SECURE: ""
      SESSION_TTL_SECONDS: 1800
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      CSP_REPORT_ONLY: "false"
      HSTS_ENABLED: ""
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

  redis:
    image: redis:7-alpine
    container_name: pvt-edu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
    name: pvt-edu-mysql-data
  redis_data:
    name: pvt-edu-redis-data
