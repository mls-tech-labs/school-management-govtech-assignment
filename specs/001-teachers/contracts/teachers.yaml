openapi: 3.1.0
info:
  title: Teachers API
  version: 0.1.0
  description: |
    Public HTTP contract for the Teachers feature (`001-teachers`).
    Part of Stage 1 — Create + Read only.
    Cross-cutting contract details (status-code table, error envelope,
    415 / 503 behaviour) are defined in `003-backend-api-db/spec.md` and
    inherited here by reference.
    Reference fields on the wire are nested `{ ulid, name }` objects on
    both POST and GET (per `003-backend-api-db/spec.md` Clarifications,
    Session 2026-06-20 (POST/GET reference object shape)).
servers:
  - url: http://localhost:3000
    description: Local dev (docker compose up)

tags:
  - name: teachers
    description: Teacher registration and lookup

paths:
  /api/v1.0/teachers:
    get:
      tags: [teachers]
      summary: List all teachers
      description: |
        Returns the full list of registered teachers. No pagination in
        Stage 1. Stage 1 upper bound: ≤ 500 teachers
        (see `001-teachers/spec.md` Clarifications, Session 2026-06-18).

        Response shape per entry:
        `{ ulid, name, subject: { ulid, name }, email, contactNumber }`.
        The top-level `ulid` and the nested `subject.ulid` are the
        26-character Crockford Base32 frontend-stable row handles (per
        `003-backend-api-db/spec.md` FR-021). Reference fields are
        nested `{ ulid, name }` objects on both POST and GET (per
        `003-backend-api-db/spec.md` Clarifications, Session
        2026-06-20 (POST/GET reference object shape)).
      operationId: listTeachers
      responses:
        "200":
          description: Teachers list (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"
              examples:
                empty:
                  summary: No teachers registered
                  value: { "data": [] }
                filled:
                  summary: Two teachers
                  value:
                    data:
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7T", name: "Alice Tan", subject: { ulid: "01H000000000000000000000A1", name: "Mathematics" }, email: "alice@example.com", contactNumber: "91234567" }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7U", name: "Bobby Lim", subject: { ulid: "01H000000000000000000000A2", name: "Science" },       email: "bobby@example.com", contactNumber: "98765432" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [teachers]
      summary: Create a new teacher
      description: |
        Validates the request body with Joi. The nested
        `subject.ulid` is resolved against the active `subjects`
        list (via `uq_subjects_ulid`); unknown / inactive values are
        rejected with `400 Bad Request` + `{ "error": "subject must
        be one of [English, Mathematics, Science, ...]" }`. The
        nested `subject.name` is a display hint and is ignored
        server-side (per `003-backend-api-db/spec.md` Clarifications,
        Session 2026-06-20 (POST/GET reference object shape)).
        Duplicate email is rejected with 409 (race-safe via the
        `UNIQUE` constraint on `teachers.email`). Any top-level
        `ulid` in the request body is ignored (`additionalProperties:
        false` on the Joi schema rejects unknown top-level fields).
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherRequest"
            examples:
              valid:
                value:
                  name: "Alice Tan"
                  subject:
                    ulid: "01H000000000000000000000A1"
                    name: "Mathematics"
                  email: "alice@example.com"
                  contactNumber: "91234567"
      responses:
        "201":
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
              example:
                ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7T"
                name: "Alice Tan"
                subject:
                  ulid: "01H000000000000000000000A1"
                  name: "Mathematics"
                email: "alice@example.com"
                contactNumber: "91234567"
        "400":
          description: Validation error (bad email, bad contact number, missing field, unknown/inactive subject)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidEmail:
                  value: { "error": "email must be a valid email" }
                invalidContact:
                  value: { "error": "contactNumber must match pattern \"^\\d{8}$\"" }
                unknownSubject:
                  value: { "error": "subject must be one of [English, Mathematics, Science, ...]" }
        "409":
          description: Duplicate email (UNIQUE constraint violation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicate:
                  value: { "error": "Email already in use" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  schemas:
    Teacher:
      type: object
      description: |
        Stage 1 wire shape of a teacher. `ulid` is the
        frontend-stable row handle (per FR-021, owned by
        `003-backend-api-db`); `email` is the natural identifier.
        Reference fields are nested `{ ulid, name }` objects per
        `003-backend-api-db/spec.md` Clarifications, Session
        2026-06-20 (POST/GET reference object shape).
      required: [ulid, name, subject, email, contactNumber]
      properties:
        ulid:
          type: string
          minLength: 26
          maxLength: 26
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: |
            26-character Crockford Base32 ULID. Generated server-side
            on insert by the `ulid` npm package. The frontend-stable
            row handle (per FR-021).
        name:
          type: string
          minLength: 1
          maxLength: 255
        subject:
          type: object
          required: [ulid, name]
          properties:
            ulid:
              type: string
              minLength: 26
              maxLength: 26
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
              description: |
                ULID of the referenced subject (the server-side lookup
                key — matched against `uq_subjects_ulid`).
            name:
              type: string
              minLength: 1
              maxLength: 64
              description: |
                Display name of the referenced subject (e.g.,
                "Mathematics"). Echoes the authoritative `name` from
                the `subjects` row; on POST it is a display hint and
                is NOT validated against the row identified by `ulid`.
        email:
          type: string
          format: email
          maxLength: 254
        contactNumber:
          type: string
          pattern: "^\\d{8}$"
          example: "91234567"
          description: Exactly 8 digits, no leading-digit restriction (per FR-004, Session 2026-06-21).

    CreateTeacherRequest:
      type: object
      required: [name, subject, email, contactNumber]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        subject:
          type: object
          required: [ulid]
          additionalProperties: false
          properties:
            ulid:
              type: string
              minLength: 26
              maxLength: 26
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
              description: |
                ULID of the referenced subject. Must match an active
                entry in the `subjects` reference list (looked up via
                `uq_subjects_ulid`). Per
                `003-backend-api-db/spec.md` Clarifications, Session
                2026-06-20 (POST/GET reference object shape).
            name:
              type: string
              minLength: 1
              maxLength: 64
              description: |
                Optional display name of the referenced subject.
                Ignored server-side — the lookup is `ulid`-only.
        email:
          type: string
          format: email
          maxLength: 254
        contactNumber:
          type: string
          pattern: "^\\d{8}$"

    TeacherListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Teacher"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            A meaningful error message for the administrator or the calling
            code. MUST NOT leak internal details (stack traces, connection
            strings, file paths, raw SQL) — see `001-teachers/spec.md`
            FR-015 (cross-cutting).

  responses:
    UnsupportedMediaType:
      description: |
        `Content-Type` is not `application/json`. See
        `003-backend-api-db/spec.md` FR-010.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: { "error": "Content-Type must be application/json" }

    InternalServerError:
      description: Unhandled server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: { "error": "Internal server error" }

    ServiceUnavailable:
      description: |
        The data store is briefly unreachable. See
        `003-backend-api-db/spec.md` FR-013. The write MUST NOT be
        partially applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: { "error": "Service temporarily unavailable, please retry" }
