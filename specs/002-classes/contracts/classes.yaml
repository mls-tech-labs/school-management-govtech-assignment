openapi: 3.1.0
info:
  title: Classes API
  version: 0.1.0
  description: |
    Public HTTP contract for the Classes feature (`002-classes`).
    Part of Stage 1 — Create + Read only.

    The Classes feature consumes the `teachers` reference via the
    `formTeacher.ulid` request field (the form teacher's ULID — the
    server-side lookup key resolved against `uq_teachers_ulid`). It is
    built on top of `001-teachers` (the `teachers` table must exist)
    and the shared cross-cutting contract defined in
    `003-backend-api-db/spec.md` (status codes, error envelope,
    415 / 503 behaviour, version prefix `/api/v1.0/`). The MySQL schema
    is user-prepared (per `003-backend-api-db/spec.md` FR-016); the
    application is read/write at runtime only.

    Reference fields on the wire are nested `{ ulid, name }` objects on
    both POST and GET (per `003-backend-api-db/spec.md` Clarifications,
    Session 2026-06-20 (POST/GET reference object shape)): `level` and
    `formTeacher` are both nested objects.

    Stage 1 deliberately does NOT expose the `id` column (the surrogate
    primary key is reserved for a future edit/delete endpoint); see
    `002-classes/spec.md` Clarifications, Session 2026-06-18 (Q5).

    Every entry on the wire includes a `ulid` row handle (per FR-021,
    owned by `003-backend-api-db`) — the frontend-stable identifier that
    future Update/Delete endpoints will route by. The `ulid` is
    server-generated; clients never set it.

    All endpoints use the Stage 1 version prefix `/api/v1.0/`
    (per `003-backend-api-db/spec.md` FR-022): `POST /api/v1.0/classes`,
    `GET /api/v1.0/classes`, `GET /api/v1.0/levels`.
servers:
  - url: http://localhost:3000
    description: Local dev (docker compose up)

tags:
  - name: classes
    description: Class registration and lookup (Create + Read)

paths:
  /api/v1.0/classes:
    get:
      tags: [classes]
      summary: List all classes
      description: |
        Returns the full list of registered classes, joined with the
        form-teacher. No pagination in Stage 1. Stage 1 upper
        bound: ≤ 500 classes
        (see `002-classes/spec.md` Clarifications, Session 2026-06-18).

        Response shape per entry:
        `{ ulid, level: { ulid, name }, name, formTeacher: { ulid, name } }`.
        The top-level `ulid` and the nested `ulid` fields on `level` and
        `formTeacher` are the 26-character Crockford Base32
        frontend-stable row handles (per FR-021, owned by
        `003-backend-api-db`). Reference fields are nested
        `{ ulid, name }` objects on both POST and GET (per
        `003-backend-api-db/spec.md` Clarifications, Session
        2026-06-20 (POST/GET reference object shape)). The `id` column
        is intentionally **not** in the response.
      operationId: listClasses
      responses:
        "200":
          description: Classes list (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassListResponse"
              examples:
                empty:
                  summary: No classes registered
                  value: { "data": [] }
                filled:
                  summary: Two classes
                  value:
                    data:
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5PA0", level: { ulid: "01H000000000000000000000B1", name: "Primary 1" }, name: "Class 1A", formTeacher: { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7R", name: "Alice Tan" } }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5PA1", level: { ulid: "01H000000000000000000000B1", name: "Primary 1" }, name: "Class 1B", formTeacher: { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7S", name: "Bobby Lim" } }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [classes]
      summary: Create a new class
      description: |
        Validates the request body with Joi. The nested `level.ulid`
        is resolved against the active `levels` list (via
        `uq_levels_ulid`); unknown / inactive values are rejected
        with `400 Bad Request` + `{ "error": "level must be one of
        [Primary 1, Primary 2, ..., Secondary 4]" }`. The nested
        `formTeacher.ulid` is resolved against the `teachers` table
        (via `uq_teachers_ulid`) — unknown values are rejected with
        `404 Not Found` + `{ "error": "Teacher not found" }`. The
        nested `name` fields on the request body are display hints
        and are NOT validated against the rows identified by `ulid`
        (per `003-backend-api-db/spec.md` Clarifications, Session
        2026-06-20 (POST/GET reference object shape)). Performs a
        pre-INSERT existence check to distinguish `404 "Teacher not
        found"` from `409 "Teacher already assigned"`, then inserts
        the row. Race-safe via the `UNIQUE` indexes on `classes.name`
        and `classes.form_teacher_id`. Any top-level `ulid` field in
        the request body is ignored (`additionalProperties: false` on
        the Joi schema rejects unknown top-level fields).
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
            examples:
              valid:
                value:
                  level:
                    ulid: "01H000000000000000000000B1"
                    name: "Primary 1"
                  name: "Class 1A"
                  formTeacher:
                    ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7R"
                    name: "Alice Tan"
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
              example:
                ulid: "01HZX8K2D5Y3J8QF8W9B3N5PA0"
                level:
                  ulid: "01H000000000000000000000B1"
                  name: "Primary 1"
                name: "Class 1A"
                formTeacher:
                  ulid: "01HZX8K2D5Y3J8QF8W9B3N5P7R"
                  name: "Alice Tan"
        "400":
          description: |
            Validation error (missing field, unknown/inactive
            `level.ulid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingName:
                  value: { "error": "name is required" }
                missingFormTeacherUlid:
                  value: { "error": "formTeacher.ulid is required" }
                unknownLevel:
                  value: { "error": "level must be one of [Primary 1, Primary 2, ..., Secondary 4]" }
        "404":
          description: |
            `formTeacher.ulid` does not match any registered teacher
            (covers the race where a teacher is deleted between page
            load and submit). Per
            `003-backend-api-db/spec.md` FR-013.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                teacherNotFound:
                  value: { "error": "Teacher not found" }
        "409":
          description: |
            Either the class `name` is already in use
            (`UNIQUE(classes.name)` violation), the teacher identified
            by `formTeacher.ulid` is already the form teacher of
            another class (`UNIQUE(classes.form_teacher_id)`
            violation), or (astronomically rarely) the server-generated
            `ulid` collides (`UNIQUE(classes.ulid)` violation — per
            FR-021). All three are race-safe by construction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateName:
                  value: { "error": "Class name already in use" }
                teacherAlreadyAssigned:
                  value: { "error": "Teacher already assigned" }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  schemas:
    Class:
      type: object
      description: |
        The Stage 1 wire shape of a class. The surrogate `id` column is
        deliberately omitted; it lives in the DB but is not returned to
        the client. Reference fields are nested `{ ulid, name }` objects
        per `003-backend-api-db/spec.md` Clarifications, Session
        2026-06-20 (POST/GET reference object shape).
      required: [ulid, level, name, formTeacher]
      properties:
        ulid:
          type: string
          minLength: 26
          maxLength: 26
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: |
            26-character Crockford Base32 ULID. Server-generated by the
            `ulid` npm package via `lib/ulid.ts` (per FR-021, owned by
            `003-backend-api-db`). The frontend-stable row handle; used
            as the React/Ant Design `Table` row key and as the route
            parameter for future Update/Delete endpoints.
        level:
          type: object
          required: [ulid, name]
          properties:
            ulid:
              type: string
              minLength: 26
              maxLength: 26
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
              description: |
                ULID of the referenced level (the server-side lookup
                key — matched against `uq_levels_ulid`).
            name:
              type: string
              minLength: 1
              maxLength: 64
              description: |
                Display name of the referenced level (e.g.,
                "Primary 1"). Echoes the authoritative `name` from the
                `levels` row; on POST it is a display hint and is NOT
                validated against the row identified by `ulid`.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Class display name (e.g., "Class 1A"). Globally unique.
        formTeacher:
          type: object
          required: [ulid, name]
          properties:
            ulid:
              type: string
              minLength: 26
              maxLength: 26
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
              description: |
                ULID of the form teacher (the server-side lookup key
                — matched against `uq_teachers_ulid`).
            name:
              type: string
              minLength: 1
              maxLength: 255
              description: |
                Form teacher's display name, resolved server-side via
                the JOIN against `teachers`. Echoes the authoritative
                `name` from the referenced teacher row; on POST it is
                a display hint and is NOT validated against the row
                identified by `ulid`.

    CreateClassRequest:
      type: object
      required: [level, name, formTeacher]
      additionalProperties: false
      properties:
        level:
          type: object
          required: [ulid]
          additionalProperties: false
          properties:
            ulid:
              type: string
              minLength: 26
              maxLength: 26
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
              description: |
                ULID of the referenced level. Must match an active
                entry in the `levels` reference list (looked up via
                `uq_levels_ulid`). Per
                `003-backend-api-db/spec.md` Clarifications, Session
                2026-06-20 (POST/GET reference object shape).
            name:
              type: string
              minLength: 1
              maxLength: 64
              description: |
                Optional display name of the referenced level.
                Ignored server-side — the lookup is `ulid`-only.
        name:
          type: string
          minLength: 1
          maxLength: 255
        formTeacher:
          type: object
          required: [ulid]
          additionalProperties: false
          properties:
            ulid:
              type: string
              minLength: 26
              maxLength: 26
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
              description: |
                ULID of the form teacher. Must match an existing
                teacher (looked up via `uq_teachers_ulid`). The
                dropdown on the Add Class form submits the selected
                teacher's `ulid` here (per
                `003-backend-api-db/spec.md` Clarifications, Session
                2026-06-20 (POST/GET reference object shape) and
                `002-classes/spec.md` Clarifications, Session
                2026-06-18, Q2).
            name:
              type: string
              minLength: 1
              maxLength: 255
              description: |
                Optional display name of the form teacher. Ignored
                server-side — the lookup is `ulid`-only. Sent for
                round-trip consistency with the GET response shape.

    ClassListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Class"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            A meaningful error message for the administrator or the
            calling code. MUST NOT leak internal details (stack traces,
            connection strings, file paths, raw SQL) — see
            `003-backend-api-db/spec.md` FR-015 (cross-cutting).

  responses:
    UnsupportedMediaType:
      description: |
        `Content-Type` is not `application/json`. See
        `003-backend-api-db/spec.md` FR-010.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: { "error": "Content-Type must be application/json" }

    InternalServerError:
      description: Unhandled server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: { "error": "Internal server error" }

    ServiceUnavailable:
      description: |
        The data store is briefly unreachable. See
        `003-backend-api-db/spec.md` FR-013. The write MUST NOT be
        partially applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: { "error": "Service temporarily unavailable, please retry" }