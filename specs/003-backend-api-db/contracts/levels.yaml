openapi: 3.1.0
info:
  title: Levels API
  version: 0.1.0
  description: |
    Public HTTP contract for the `levels` reference list. The list
    is read-only in Stage 1 (no POST / PUT / DELETE); the data is
    seeded by the user against the user-prepared MySQL container (per
    `003-backend-api-db/spec.md` FR-016) and surfaced as a dropdown
    on the Add Class form. See `003-backend-api-db/spec.md` FR-009c.
    The version prefix `/api/v1.0/` is literal (per
    `003-backend-api-db/spec.md` FR-022).
servers:
  - url: http://localhost:3000
    description: Local dev (docker compose up)

tags:
  - name: levels
    description: Levels reference list (read-only)

paths:
  /api/v1.0/levels:
    get:
      tags: [levels]
      summary: List active levels
      description: |
        Returns the entries from the `levels` table where
        `active = true`. The Stage 1 seed list is the only data
        source; admin authoring is out of scope (see
        `003-backend-api-db/spec.md` Assumptions).

        Response shape per entry:
        `{ ulid, name, active }`. The `ulid` is the 26-character
        Crockford Base32 frontend-stable row handle (per FR-021).
      operationId: listActiveLevels
      responses:
        "200":
          description: Active levels list (may be empty if the seed migration has not run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelListResponse"
              examples:
                seeded:
                  value:
                    data:
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P80", name: "Primary 1",   active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P81", name: "Primary 2",   active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P82", name: "Primary 3",   active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P83", name: "Primary 4",   active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P84", name: "Primary 5",   active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P85", name: "Primary 6",   active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P86", name: "Secondary 1", active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P87", name: "Secondary 2", active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P88", name: "Secondary 3", active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P89", name: "Secondary 4", active: true }
                empty:
                  summary: Seed not yet applied
                  value: { data: [] }
        "415":
          $ref: "./common.yaml#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "./common.yaml#/components/responses/InternalServerError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

components:
  schemas:
    Level:
      type: object
      required: [ulid, name, active]
      properties:
        ulid:
          type: string
          minLength: 26
          maxLength: 26
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: |
            26-character Crockford Base32 ULID. Generated server-side
            by the `ulid` npm package on insert (per FR-021). The
            frontend-stable row handle.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Display name of the level as it appears in the Add Class
            dropdown (e.g., "Primary 1", "Secondary 4").
        active:
          type: boolean
          description: |
            Whether the level is currently selectable. Stage 1 always
            reads `WHERE active = true`.

    LevelListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Level"
