openapi: 3.1.0
info:
  title: Subjects API
  version: 0.1.0
  description: |
    Public HTTP contract for the `subjects` reference list. The list
    is read-only in Stage 1 (no POST / PUT / DELETE); the data is
    seeded by the user against the user-prepared MySQL container (per
    `003-backend-api-db/spec.md` FR-016) and surfaced as a dropdown
    on the Add Teacher form. See
    `003-backend-api-db/spec.md` FR-009c. The version prefix
    `/api/v1.0/` is literal (per
    `003-backend-api-db/spec.md` FR-022).
servers:
  - url: http://localhost:3000
    description: Local dev (docker compose up)

tags:
  - name: subjects
    description: Subjects reference list (read-only)

paths:
  /api/v1.0/subjects:
    get:
      tags: [subjects]
      summary: List active subjects
      description: |
        Returns the entries from the `subjects` table where
        `active = true`. The Stage 1 seed list is the only data
        source; admin authoring is out of scope (see
        `003-backend-api-db/spec.md` Assumptions).

        Response shape per entry:
        `{ ulid, name, active }`. The `ulid` is the 26-character
        Crockford Base32 frontend-stable row handle (per FR-021).
      operationId: listActiveSubjects
      responses:
        "200":
          description: Active subjects list (may be empty if the seed migration has not run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectListResponse"
              examples:
                seeded:
                  value:
                    data:
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P70", name: "English",             active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P71", name: "Mathematics",         active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P72", name: "Science",             active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P73", name: "Chinese",             active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P74", name: "Malay",               active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P75", name: "Tamil",               active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P76", name: "Art",                 active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P77", name: "Music",               active: true }
                      - { ulid: "01HZX8K2D5Y3J8QF8W9B3N5P78", name: "Physical Education",  active: true }
                empty:
                  summary: Seed not yet applied
                  value: { data: [] }
        "415":
          $ref: "./common.yaml#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "./common.yaml#/components/responses/InternalServerError"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

components:
  schemas:
    Subject:
      type: object
      required: [ulid, name, active]
      properties:
        ulid:
          type: string
          minLength: 26
          maxLength: 26
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: |
            26-character Crockford Base32 ULID. Generated server-side
            by the `ulid` npm package on insert (per FR-021). The
            frontend-stable row handle.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Display name of the subject as it appears in the Add
            Teacher dropdown (e.g., "Mathematics").
        active:
          type: boolean
          description: |
            Whether the subject is currently selectable. Stage 1
            always reads `WHERE active = true`.

    SubjectListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
